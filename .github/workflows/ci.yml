name: CI

on:
  push:
    branches: ['main', 'master']
  pull_request:

permissions:
  contents: read

concurrency:
  group: aggregation-hub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Windows Foundation Gate
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      - name: Setup pnpm 11.18.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Cache pnpm store
        id: pnpm-store
        shell: pwsh
        run: |
          "path=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup Go 1.26.5
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true

      - name: Setup Rust from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Verify toolchain versions
        shell: pwsh
        run: |
          node --version
          pnpm --version
          go version
          rustc --version
          cargo --version

      - name: Install frozen dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run serial Phase 0 gate
        shell: pwsh
        run: powershell -NoProfile -File scripts/test-all.ps1

      - name: Build Core sidecar
        shell: pwsh
        run: pnpm build:core

      - name: Build Desktop web bundle
        shell: pwsh
        run: pnpm --dir apps/desktop build

      - name: Build Tauri Rust application
        shell: pwsh
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml