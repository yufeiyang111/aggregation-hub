[package]
name = "aggregation-hub-desktop"
version = "0.1.0-rc.3"
description = "Aggregation Hub 本地 LLM 聚合网关桌面控制面"
authors = ["Aggregation Hub Contributors"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
